# deal-scout needs only the standard library. Run it from a checkout (python3 -m deal_scout, or `uv run deal-scout`)
# or install the package (it ships the deal-scout command). uv manages the dev tools and the optional provider SDKs:
# `uv sync` (dev tools, installs the project editable), `uv sync --extra anthropic` (Claude API provider),
# `uv sync --extra mcp` (the MCP server; the dev tools include it so CI tests it).
# Builds must never contain the owner's private files: criteria.md, .env, inbox/, listings/, logs/ (scripts/check_dist.py).

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "deal-scout"
version = "0.2.0"
description = "A private Telegram assistant that reviews second-hand listings before you buy"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic"]  # PROVIDER=anthropic
openai = ["openai"]        # PROVIDER=openai or openrouter
mcp = ["mcp==2.3.0"]       # deal-scout mcp: the MCP server

[dependency-groups]
dev = ["ruff==0.17.5", "mypy==2.4.1", "pytest==9.2.0", "pytest-cov==7.1.0", "pre-commit==4.7.0", "mcp==2.3.0"]

[project.scripts]
deal-scout = "deal_scout.cli:main"
deal-scout-mcp = "deal_scout.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["deal_scout"]
exclude = ["**/criteria.md", "**/__pycache__"]

[tool.hatch.build.targets.wheel.force-include]
"domains" = "deal_scout/_domains"        # the shipped domains, minus criteria.md (excluded above)
".env.example" = "deal_scout/_env.example"  # copied to .env by `deal-scout init`

[tool.hatch.build.targets.sdist]
include = ["/deal_scout", "/domains", "/scripts", "/README.md", "/LICENSE", "/pyproject.toml", "/uv.lock", "/.env.example"]
exclude = [
    "**/criteria.md", "**/.env", "**/.state.json", "inbox", "listings", "logs", "IMG_*", ".venv", "_site",
    "**/__pycache__", "**/*.pyc",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "inbox", "listings", "logs"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "D",       # pydocstyle
    "B",       # flake8-bugbear
    "UP",      # pyupgrade (f-strings, modern type syntax)
    "G",       # flake8-logging-format (lazy %-style logging, no f-strings in log calls)
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
known-first-party = ["deal_scout"]

[tool.ruff.lint.per-file-ignores]
# Test names and fakes don't need docstrings.
"tests/*" = ["D"]

[tool.mypy]
python_version = "3.12"
files = ["deal_scout"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# Optional SDKs, imported lazily by their provider; not installed in CI.
module = ["anthropic", "anthropic.*", "openai", "openai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
source = ["deal_scout"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
exclude_also = [
    'if __name__ == "__main__":',
    'raise AssertionError\("unreachable"\)',
]
