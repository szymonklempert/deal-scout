# deal-scout runs from a checkout (python3 -m deal_scout) and needs only the standard library. uv manages the dev
# tools and the optional provider SDKs: `uv sync` (dev tools), `uv sync --extra anthropic` (Claude API provider).

[project]
name = "deal-scout"
version = "0.1.0"
description = "A private Telegram assistant that reviews second-hand listings before you buy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic"]  # PROVIDER=anthropic
openai = ["openai"]        # PROVIDER=openai or openrouter

[dependency-groups]
dev = ["ruff==0.17.5", "mypy==2.4.1"]

[tool.uv]
package = false  # an app run from the checkout, not an installable package

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv", "inbox", "listings", "logs"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "D",       # pydocstyle
    "B",       # flake8-bugbear
    "UP",      # pyupgrade (f-strings, modern type syntax)
    "G",       # flake8-logging-format (lazy %-style logging, no f-strings in log calls)
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
known-first-party = ["deal_scout"]

[tool.ruff.lint.per-file-ignores]
# Test names and fakes don't need docstrings.
"tests/*" = ["D"]

[tool.mypy]
python_version = "3.10"
files = ["deal_scout"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# Optional SDKs, imported lazily by their provider; not installed in CI.
module = ["anthropic", "anthropic.*", "openai", "openai.*"]
ignore_missing_imports = true
