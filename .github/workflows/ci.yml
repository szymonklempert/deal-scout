name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04  # pinned: a new image can drop prebuilt Python versions
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dev tools
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing
      - name: Coverage summary
        if: matrix.python-version == '3.14'
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Build the package and check what it ships
        if: matrix.python-version == '3.14'
        run: |
          uv build
          uv run python scripts/check_dist.py
