name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04  # pinned: a new image can drop prebuilt Python versions
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev tools
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy
      - name: Tests
        run: python -m unittest discover -s tests -v
